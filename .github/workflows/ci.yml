name: CI
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libelf-dev libbpf-dev linux-headers-generic
      - name: Resolve Dependencies
        run: |
          go mod download
          go mod tidy
      - name: Format Check
        run: test -z "$(gofmt -l ./cmd ./internal)" || (gofmt -l ./cmd ./internal; exit 1)
      - name: Vet
        run: go vet ./...
      - name: Unit Tests
        run: go test -race ./internal/...
      - name: Cross-Compile ARM64
        run: GOOS=linux GOARCH=arm64 go build ./cmd/arm64-pmu-collector
      - name: Build eBPF
        run: make bpf/pmu.bpf.o
