name: CI
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libelf-dev libbpf-dev linux-headers-generic
          # Ensure asm/types.h is available by creating a robust symlink
          sudo mkdir -p /usr/include/asm
          if [ ! -f /usr/include/asm/types.h ]; then
            # Try to find it in the arch-specific folder
            SRC=$(find /usr/include -name types.h -path "*/asm/*" | head -n 1)
            if [ -n "$SRC" ]; then
              sudo ln -sf "$SRC" /usr/include/asm/types.h
              echo "Linked $SRC to /usr/include/asm/types.h"
            else
              echo "Warning: asm/types.h not found, attempting generic install..."
              sudo apt-get install -y libc6-dev-amd64
            fi
          fi
      - name: Resolve Dependencies
        run: go mod tidy
      - name: Format Check
        run: test -z "$(gofmt -l ./cmd ./internal)" || (gofmt -l ./cmd ./internal; exit 1)
      - name: Vet
        run: go vet ./...
      - name: Unit Tests
        run: go test -race ./internal/...
      - name: Cross-Compile ARM64
        run: GOOS=linux GOARCH=arm64 go build -o arm64-pmu-collector ./cmd/arm64-pmu-collector
      - name: Build eBPF
        run: make bpf/pmu.bpf.o
      - name: Verify Binary
        run: file arm64-pmu-collector | grep "ARM aarch64"
